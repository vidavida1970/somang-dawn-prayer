name: Daily Somang Dawn Prayer Update

on:
  schedule:
    # 한국 시간(KST) 매일 오전 07:20 (UTC 기준 전날 22:20)
    - cron: '20 22 * * *'
  workflow_dispatch: # 필요 시 수동 실행 버튼 활성화

jobs:
  update-prayer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install youtube-transcript-api requests beautifulsoup4

      - name: 새벽기도문 추출 및 HTML 생성
        run: |
          python update_prayer.py

      - name: 변경사항 깃허브 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%Y-%m-%d') 새벽기도문" && git push)
